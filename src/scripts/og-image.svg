<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<style>
			.text-serif { font-family: "Noto Serif"; }
			.text-myanmar { font-family: "Noto Sans Myanmar"; }
			.text-arabic { font-family: "Noto Naskh Arabic"; }
		</style>
	</defs>

	<!-- Left brand panel -->
	<rect width="430" height="630" fill="#0e6b4a"/>
	<!-- Gold star: two rounded squares, one rotated 45deg -->
	<rect x="187" y="147" width="56" height="56" rx="8" fill="#e8c268"/>
	<rect x="187" y="147" width="56" height="56" rx="8" fill="#e8c268" transform="rotate(45 215 175)"/>
	<!-- Arabic brand name -->
	<text class="text-arabic" x="215" y="300" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">بصيرة</text>
	<!-- Gold divider -->
	<rect x="165" y="345" width="100" height="4" rx="2" fill="#e8c268"/>
	<!-- Latin wordmark -->
	<text class="text-serif" x="215" y="422" font-size="34" font-weight="700" letter-spacing="12" fill="#ffffff" text-anchor="middle">BASIRAH</text>

	<!-- Right paper panel -->
	<rect x="430" width="770" height="630" fill="#fdfbf7"/>
	<text class="text-serif" x="505" y="268" font-size="96" font-weight="700" fill="#1f2924">Basirah</text>
	<rect x="505" y="300" width="90" height="6" rx="3" fill="#e8c268"/>
	<text class="text-myanmar" x="505" y="368" font-size="30" font-weight="700" fill="#0e6b4a">ကုရ်အာန်နှင့် စွန္နသ်မှ အသိပညာ ဗဟုသုတ</text>
	<text class="text-serif" x="505" y="422" font-size="22" font-weight="400" fill="#5c6b63">Wisdom from the Qur'an and Sunnah</text>

	<!-- Footer -->
	<rect x="505" y="555" width="645" height="1" fill="#e5dfd2"/>
	<text class="text-serif" x="505" y="590" font-size="16" font-weight="400" fill="#8a938c">Surahs · Duas · Names of Allah</text>
	<text class="text-serif" x="1150" y="590" font-size="16" font-weight="400" fill="#8a938c" text-anchor="end">basirah.pages.dev</text>
</svg>